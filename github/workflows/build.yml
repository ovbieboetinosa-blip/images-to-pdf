name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          mkdir www && cp ../index.html www/index.html
          npx cap init "Images to PDF" com.pliris.imagestopdf --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk ImagesToPDF.apk
          gh release create "build-${{ github.run_number }}" ImagesToPDF.apk \
            --title "Images to PDF build ${{ github.run_number }}" \
            --notes "Debug APK. Install on Android 6+."
